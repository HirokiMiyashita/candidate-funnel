# Supabase CLI ローカル開発設定
# 全項目のリファレンス: https://supabase.com/docs/guides/local-development/cli/config
project_id = "candidate-funnel"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# ローカルで送信されたメールは http://127.0.0.1:54324 で確認できます
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
# 管理画面のパスは環境変数で決まるため、ワイルドカードで許可
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# 管理画面は招待制。誰でも登録できる公開の登録 API は止める（招待はサーバーから行う）
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# ローカル検証用に緩めています（デフォルトは 1 時間あたり 2 通）
email_sent = 30

[auth.email]
# メールアドレス＋パスワードでのログイン自体の ON/OFF（false にするとログインもできなくなる）。
# 公開の新規登録を止めるのは上の [auth] enable_signup = false の方
enable_signup = true
double_confirm_changes = true
# メール認証を必須にする（ローカルでも ON）
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 86400

# 招待メール（リンク先は管理画面の /auth/confirm。管理画面の URL は環境変数で決まるため RedirectTo を使う）
[auth.email.template.invite]
subject = "管理画面への招待"
content_path = "./supabase/templates/invite.html"
